name: Signal plate

# Redraws PL. 06 (assets/plates/signal-*.svg) from the GitHub contributions calendar.
on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal-plate
  cancel-in-progress: true

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      - name: Fetch contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/fetch_activity.py "${{ github.repository_owner }}"

      - name: Redraw plate
        run: python tools/build.py signal

      - name: Commit if changed
        run: |
          git add tools/data/contributions.json assets/plates/signal-*.svg
          if git diff --cached --quiet; then
            echo "Signal unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Redraw PL. 06 signal"
          git push
